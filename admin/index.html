<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Lord Anchovy</title>
    <style>
        body { font-family: Arial, sans-serif; background: #222; color: #fff; padding: 20px; }
        .container { max-width: 700px; margin: auto; background: #333; padding: 20px; border-radius: 8px; }
        h1, h2 { text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input[type="text"], input[type="password"], textarea, input[type="file"] {
            width: 100%; padding: 10px; margin-top: 5px; border-radius: 4px; border: none; box-sizing: border-box;
        }
        button {
            margin-top: 20px; width: 100%; padding: 12px; background: #4CAF50; color: white; 
            border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold;
        }
        button:hover { background: #45a049; }
        .cancel-btn { background: #d32f2f; display: none; margin-top: 10px; }
        .cancel-btn:hover { background: #b71c1c; }
        
        /* Manage Posts List Styles */
        .post-item { background: #444; padding: 15px; margin-top: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .post-item h3 { margin: 0; font-size: 16px; }
        .action-btns button { width: auto; padding: 8px 12px; margin-top: 0; margin-left: 5px; font-size: 14px; }
        .edit-btn { background: #2196F3; } .edit-btn:hover { background: #1976D2; }
        .delete-btn { background: #f44336; } .delete-btn:hover { background: #d32f2f; }
        
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🐢 Anchovy's Admin</h1>
        
        <!-- Token Setup Screen -->
        <div id="token-setup">
            <p>Welcome! Paste your GitHub Personal Access Token to unlock the dashboard.</p>
            <label>GitHub Token:</label>
            <input type="password" id="pat-input" placeholder="github_pat_...">
            <button onclick="saveToken()">Unlock Dashboard</button>
        </div>

        <!-- Main Admin Form -->
        <div id="admin-form" class="hidden">
            <h2 id="form-title">Create a New Post</h2>
            
            <!-- Hidden fields for editing -->
            <input type="hidden" id="edit-post-id">
            <input type="hidden" id="edit-image-path">

            <label>Post Title:</label>
            <input type="text" id="post-title" placeholder="e.g., Morning Cats at the Market">

            <label>Your Writing (Story):</label>
            <textarea id="post-body" rows="5" placeholder="Write about your photo walk here..."></textarea>

            <label>Upload Photo (Leave blank to keep existing photo when editing):</label>
            <input type="file" id="post-image" accept="image/*">

            <button onclick="publishPost()" id="publish-btn">Publish to Website</button>
            <button onclick="resetForm()" id="cancel-btn" class="cancel-btn">Cancel Edit</button>
            <div id="status"></div>

            <hr style="margin: 30px 0; border-color: #555;">
            
            <!-- List of existing posts -->
            <h2>Manage Posts</h2>
            <div id="posts-list">
                <p>Loading posts...</p>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
